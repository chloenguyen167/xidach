name: xidach
description: "Tính điểm xì dách — ghi điểm/tiền từng ván, offline."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  font_awesome_flutter: ^11.0.0
  in_app_purchase: ^3.3.1
  intl: ^0.20.2
  path: ^1.9.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4+1
  sqflite_common_ffi_web: ^1.2.0
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png

# Sinh icon: dart run flutter_launcher_icons  (nguồn vẽ ở tool/icon, chạy tool/icon/render.sh để vẽ lại)
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "tool/icon/icon_full.png"
  adaptive_icon_background: "#33A13F"
  adaptive_icon_foreground: "tool/icon/icon_foreground.png"
  adaptive_icon_monochrome: "tool/icon/icon_monochrome.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

# sqflite_common_ffi_web (bản web) kéo theo package sqlite3. Mặc định build hook của nó
# sẽ nhét libsqlite3 vào APK/IPA dù app native không dùng tới (native vẫn đi qua sqflite
# + SQLite của hệ thống). "system" = không bundle file nào; test trên máy dev cũng dùng
# SQLite hệ thống (macOS có sẵn, Linux cần libsqlite3-dev).
hooks:
  user_defines:
    sqlite3:
      source: system
